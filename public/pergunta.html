<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenho uma pergunta pra você 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;600&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#fde4ec; --ink:#4a1230; --soft:#9a3d66; --card:#fff6f9; --yes:#e0245e; --yesink:#fff; --no:#f3c9d8; --noink:#4a1230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a0f2e; --ink:#ffe3ee; --soft:#f2a1c2; --card:#3d1744; --yes:#ff3d7f; --yesink:#fff; --no:#5a2a63; --noink:#ffe3ee; }
}
:root[data-theme="dark"]{ --bg:#2a0f2e; --ink:#ffe3ee; --soft:#f2a1c2; --card:#3d1744; --yes:#ff3d7f; --yesink:#fff; --no:#5a2a63; --noink:#ffe3ee; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-60px;opacity:.55;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
.card{position:relative;z-index:2;width:min(92vw,440px);background:var(--card);border-radius:28px;padding:34px 26px 30px;text-align:center;box-shadow:0 10px 0 rgba(224,36,94,.18)}
.emoji{font-size:64px;line-height:1;display:inline-block;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
h1{font-family:"Pacifico",cursive;font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.3;margin:14px 0 6px}
p{margin:0 0 22px;color:var(--soft);font-size:17px}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:999px;padding:13px 30px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:var(--yes);color:var(--yesink);transform-origin:center;transition:transform .2s}
#yes:hover{filter:brightness(1.08)}
#no{background:var(--no);color:var(--noink);transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1)}
#no.run{position:fixed;z-index:5}
.count{margin-top:18px;font-size:14px;min-height:20px;color:var(--soft)}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:28px;animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){.hearts span,.emoji{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="card" id="card">
  <div class="emoji" id="emoji">💌</div>
  <h1 id="title">Quer ficar comigo?</h1>
  <p id="sub">Pensa com carinho, tá?</p>
  <div class="row" id="row">
    <button id="yes" type="button">Sim 💖</button>
    <button id="no" type="button">Não</button>
  </div>
  <div class="count" id="count"></div>
</main>
<script>
(function(){
  var name = "";
  try { name = decodeURIComponent(location.hash.slice(1)).replace(/[^\p{L}\p{N} ]/gu,"").slice(0,30); } catch(e){}
  if(name){ document.getElementById("title").textContent = name + ", quer ficar comigo?"; }

  var icons = ["💖","💗","💕","💘","🌸","💞"];
  var hearts = document.getElementById("hearts");
  for(var i=0;i<16;i++){
    var s = document.createElement("span");
    s.textContent = icons[i % icons.length];
    s.style.left = (Math.random()*96)+"%";
    s.style.fontSize = (16+Math.random()*26)+"px";
    s.style.animationDuration = (9+Math.random()*10)+"s";
    s.style.animationDelay = (-Math.random()*14)+"s";
    hearts.appendChild(s);
  }

  var yes = document.getElementById("yes"), no = document.getElementById("no");
  var row = document.getElementById("row"), count = document.getElementById("count");
  var sub = document.getElementById("sub");
  var tries = 0, scale = 1, placeholder = null, lastDodge = 0;
  var lines = ["Não","Tem certeza?","Pensa melhor…","Olha o coraçãozinho 🥺","Vai magoar…","Sério mesmo?","Quase, hein","Desiste 😅","Clica no Sim!"];
  var pointer = {x:-999,y:-999};

  function dodge(){
    var now = Date.now();
    if(now - lastDodge < 450){ return; }
    lastDodge = now;
    tries++;
    if(!no.classList.contains("run")){
      var r = no.getBoundingClientRect();
      placeholder = document.createElement("span");
      placeholder.style.width = r.width+"px"; placeholder.style.height = r.height+"px";
      row.appendChild(placeholder);
      no.classList.add("run");
      no.style.left = r.left+"px"; no.style.top = r.top+"px";
      void no.offsetWidth;
    }
    no.textContent = lines[Math.min(tries, lines.length-1)];
    var w = no.offsetWidth, h = no.offsetHeight, m = 12, best = null;
    var maxX = window.innerWidth - w - m, maxY = window.innerHeight - h - m;
    for(var i=0;i<30;i++){
      var x = m + Math.random()*Math.max(maxX-m,0), y = m + Math.random()*Math.max(maxY-m,0);
      var d = Math.hypot(x+w/2-pointer.x, y+h/2-pointer.y);
      if(!best || d > best.d){ best = {x:x,y:y,d:d}; }
      if(d > 220) break;
    }
    no.style.left = best.x+"px"; no.style.top = best.y+"px";
    scale = Math.min(scale+0.12, 2.1);
    yes.style.transform = "scale("+scale+")";
    row.style.minHeight = (64*scale)+"px";
    count.textContent = "Tentativas de dizer não: " + tries;
    sub.textContent = tries > 4 ? "O botão do Sim está crescendo, já reparou?" : "Pensa com carinho, tá?";
  }

  no.addEventListener("pointerenter", function(e){ pointer.x=e.clientX; pointer.y=e.clientY; dodge(); });
  no.addEventListener("pointerdown", function(e){ e.preventDefault(); pointer.x=e.clientX; pointer.y=e.clientY; dodge(); });
  no.addEventListener("click", function(e){ e.preventDefault(); dodge(); });
  document.addEventListener("pointermove", function(e){
    pointer.x = e.clientX; pointer.y = e.clientY;
    if(no.classList.contains("run")){
      var r = no.getBoundingClientRect();
      if(Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2)) < 90){ dodge(); }
    }
  });

  yes.addEventListener("click", function(){
    document.getElementById("emoji").textContent = "🥰";
    document.getElementById("title").textContent = "Eu sabia! Vai ser muito bom 💕";
    sub.textContent = "Você acabou de fazer meu dia.";
    row.style.display = "none";
    no.style.display = "none";
    count.textContent = tries ? "Depois de " + tries + " tentativas de fuga do Não 😂" : "";
    var rect = document.getElementById("card").getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    for(var i=0;i<46;i++){
      var b = document.createElement("span");
      b.className = "burst";
      b.textContent = icons[i % icons.length];
      b.style.left = cx+"px"; b.style.top = cy+"px";
      var a = Math.random()*Math.PI*2, d = 140+Math.random()*320;
      b.style.setProperty("--dx", Math.cos(a)*d+"px");
      b.style.setProperty("--dy", Math.sin(a)*d+"px");
      b.style.setProperty("--r", (Math.random()*360-180)+"deg");
      document.body.appendChild(b);
      setTimeout(function(el){ return function(){ el.remove(); }; }(b), 1700);
    }
  });
})();
</script>
</body>
</html>
